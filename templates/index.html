<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My To-Do List</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
  <style>
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body class="container py-4">

  <h1 class="text-center mb-4">✅ My To-Do List</h1>

  <!-- Add Task Form -->
  <form action="/add" method="POST" class="mb-3 d-flex gap-2">
    <input
      type="text"
      name="title"
      class="form-control"
      placeholder="Write your next task..."
      required
    >
    <button type="submit" class="btn btn-primary">Add</button>
  </form>

  <ul class="list-group">
    {% for task in tasks %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <form action="/toggle/{{ task.id }}" method="POST" style="display:inline;">
          <input
            type="checkbox"
            onchange="this.form.submit()"
            {% if task.completed %}checked{% endif %}
          >
          <span class="{% if task.completed %}completed{% endif %}">
            {{ task.title }}
          </span>
        </form>
        <a href="/delete/{{ task.id }}" class="btn btn-sm btn-danger">Delete</a>
      </li>
    {% endfor %}
  </ul>

</body>
</html>
